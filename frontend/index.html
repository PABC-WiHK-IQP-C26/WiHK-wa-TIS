<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <link href="styles.css" rel="stylesheet">
    <title>WiHK - Tour Information Scraper</title>
  </head>
  <body>
    <h1>Tour Info Scraper</h1>
    <div id="tis-entryField">
      <label for="client-text"> <h2>Enter Client Message </h2></label>
      <textarea id="client-text-input" name="client-text-input" onkeydown="handleKeyDown(event)"></textarea><br><br> 
      <input type="button" id="submit-button" value="Generate Message" onclick="processClientMessage()">
    </div>
    <div>
      <td>
      <h2>Message to paste:</h2>
      <textarea id="output-text" name="output-text" readonly></textarea><br><br>


      <input type="button" id="copy-whatsapp-button" value="Copy for WhatsApp" onclick="copyOutputText()">
      <input type="button" id="copy-email-html-button" value="Copy for Email" onclick="copyAsEmailHTML()">
      <input type="button" id="format-as-email-button" value="Download as PDF" onclick="formatAsEmail()">
      </td>
      <td>
        <h3>Use the following dropdowns to lookup price.</h3>
        <h2>Tour</h2>
        <select name="Tours" id="tours-dropdown" onchange="show(this)">

        </select>

        <h3>Type</h3>
        <select name="Tour Type" id="tour-type-dropdown">
          <option value="None">None</option>
          <option value="Educational">Educational</option>
          <option value="Private">Private</option>
        </select>

        <h3>Group Size</h3>
        <select name="Group Size" id="group-size-dropdown">
        
        </select>

        <h3 id="price-display">Price: </h3>

      </td>
      
      

    </div>
    
    <script src="app.js"></script>
  </body>
</html>
